name: Render Video17

# Renders all 1800 frames of the Video17 composition in 15 parallel
# jobs (120 frames each). Each job uploads its 120-frame mp4 as an artifact;
# the artifacts are concatenated and muxed with audio/mix.wav locally
# afterwards. No frames are rendered locally for this video.
#
# Trigger manually from the Actions tab (workflow_dispatch).

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: 0
            start: 0
            end: 119
          - job: 1
            start: 120
            end: 239
          - job: 2
            start: 240
            end: 359
          - job: 3
            start: 360
            end: 479
          - job: 4
            start: 480
            end: 599
          - job: 5
            start: 600
            end: 719
          - job: 6
            start: 720
            end: 839
          - job: 7
            start: 840
            end: 959
          - job: 8
            start: 960
            end: 1079
          - job: 9
            start: 1080
            end: 1199
          - job: 10
            start: 1200
            end: 1319
          - job: 11
            start: 1320
            end: 1439
          - job: 12
            start: 1440
            end: 1559
          - job: 13
            start: 1560
            end: 1679
          - job: 14
            start: 1680
            end: 1799
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Poppins fonts (karaoke text uses Poppins ExtraBold)
        run: |
          mkdir -p ~/.fonts
          cp fonts/*.ttf ~/.fonts/
          fc-cache -f
          fc-list | grep -i poppins

      - name: Install ffmpeg (needed for the ffprobe verification step)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Ensure Chrome Headless Shell
        run: npx remotion browser ensure

      - name: Render frames ${{ matrix.start }}-${{ matrix.end }}
        run: >
          npx remotion render Video17
          video17-chunk-${{ matrix.job }}.mp4
          --frames=${{ matrix.start }}-${{ matrix.end }}
          --concurrency=1
          --timeout=300000

      - name: Verify chunk (must be exactly 120 frames, 1080x1920)
        run: |
          FRAMES=$(ffprobe -v error -count_frames -select_streams v:0 \
            -show_entries stream=nb_read_frames -of csv=p=0 \
            video17-chunk-${{ matrix.job }}.mp4)
          echo "frames=$FRAMES"
          test "$FRAMES" = "120"
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height -of csv=p=0 \
            video17-chunk-${{ matrix.job }}.mp4

      - name: Upload chunk artifact
        uses: actions/upload-artifact@v4
        with:
          name: video17-chunk-${{ matrix.job }}
          path: video17-chunk-${{ matrix.job }}.mp4
          retention-days: 7
