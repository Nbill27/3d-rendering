name: Render Video11

# Renders all 1396 frames of the Video11 composition (TobaTestV2, Danau
# Toba test v2: bean-head guide in flannel, 3D world) in 10 parallel
# jobs. Jobs 0-8 render 140 frames each, job 9 renders the remaining
# 136 frames (9*140 + 136 = 1396).
# Each job uploads its chunk mp4 as an artifact; the artifacts are
# concatenated and muxed with audio/mix.wav locally afterwards.
#
# Trigger manually from the Actions tab (workflow_dispatch).

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: 0
            start: 0
            end: 139
            frames: 140
          - job: 1
            start: 140
            end: 279
            frames: 140
          - job: 2
            start: 280
            end: 419
            frames: 140
          - job: 3
            start: 420
            end: 559
            frames: 140
          - job: 4
            start: 560
            end: 699
            frames: 140
          - job: 5
            start: 700
            end: 839
            frames: 140
          - job: 6
            start: 840
            end: 979
            frames: 140
          - job: 7
            start: 980
            end: 1119
            frames: 140
          - job: 8
            start: 1120
            end: 1259
            frames: 140
          - job: 9
            start: 1260
            end: 1395
            frames: 136
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Poppins fonts (karaoke text uses Poppins ExtraBold)
        run: |
          mkdir -p ~/.fonts
          cp fonts/*.ttf ~/.fonts/
          fc-cache -f
          fc-list | grep -i poppins

      - name: Install ffmpeg (needed for the ffprobe verification step)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Ensure Chrome Headless Shell
        run: npx remotion browser ensure

      - name: Render frames ${{ matrix.start }}-${{ matrix.end }}
        run: >
          npx remotion render Video11
          video11-chunk-${{ matrix.job }}.mp4
          --frames=${{ matrix.start }}-${{ matrix.end }}
          --concurrency=1
          --timeout=300000

      - name: Verify chunk (must be exactly ${{ matrix.frames }} frames, 1080x1920)
        run: |
          FRAMES=$(ffprobe -v error -count_frames -select_streams v:0 \
            -show_entries stream=nb_read_frames -of csv=p=0 \
            video11-chunk-${{ matrix.job }}.mp4)
          echo "frames=$FRAMES"
          test "$FRAMES" = "${{ matrix.frames }}"
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height -of csv=p=0 \
            video11-chunk-${{ matrix.job }}.mp4

      - name: Upload chunk artifact
        uses: actions/upload-artifact@v4
        with:
          name: video11-chunk-${{ matrix.job }}
          path: video11-chunk-${{ matrix.job }}.mp4
          retention-days: 7
