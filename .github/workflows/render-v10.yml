name: Render Video10

# Renders all 1622 frames of the Video10 composition (TobaTest, Fafnir
# style test) in 10 parallel jobs. Jobs 0-8 render 163 frames each,
# job 9 renders the remaining 155 frames (9*163 + 155 = 1622).
# Each job uploads its chunk mp4 as an artifact; the artifacts are
# concatenated and muxed with audio/mix.wav locally afterwards.
#
# Trigger manually from the Actions tab (workflow_dispatch).

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: 0
            start: 0
            end: 162
            frames: 163
          - job: 1
            start: 163
            end: 325
            frames: 163
          - job: 2
            start: 326
            end: 488
            frames: 163
          - job: 3
            start: 489
            end: 651
            frames: 163
          - job: 4
            start: 652
            end: 814
            frames: 163
          - job: 5
            start: 815
            end: 977
            frames: 163
          - job: 6
            start: 978
            end: 1140
            frames: 163
          - job: 7
            start: 1141
            end: 1303
            frames: 163
          - job: 8
            start: 1304
            end: 1466
            frames: 163
          - job: 9
            start: 1467
            end: 1621
            frames: 155
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Poppins fonts (karaoke text uses Poppins ExtraBold)
        run: |
          mkdir -p ~/.fonts
          cp fonts/*.ttf ~/.fonts/
          fc-cache -f
          fc-list | grep -i poppins

      - name: Install ffmpeg (needed for the ffprobe verification step)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Ensure Chrome Headless Shell
        run: npx remotion browser ensure

      - name: Render frames ${{ matrix.start }}-${{ matrix.end }}
        run: >
          npx remotion render Video10
          video10-chunk-${{ matrix.job }}.mp4
          --frames=${{ matrix.start }}-${{ matrix.end }}
          --concurrency=1
          --timeout=300000

      - name: Verify chunk (must be exactly ${{ matrix.frames }} frames, 1080x1920)
        run: |
          FRAMES=$(ffprobe -v error -count_frames -select_streams v:0 \
            -show_entries stream=nb_read_frames -of csv=p=0 \
            video10-chunk-${{ matrix.job }}.mp4)
          echo "frames=$FRAMES"
          test "$FRAMES" = "${{ matrix.frames }}"
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height -of csv=p=0 \
            video10-chunk-${{ matrix.job }}.mp4

      - name: Upload chunk artifact
        uses: actions/upload-artifact@v4
        with:
          name: video10-chunk-${{ matrix.job }}
          path: video10-chunk-${{ matrix.job }}.mp4
          retention-days: 7
