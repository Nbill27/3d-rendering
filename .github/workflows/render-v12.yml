name: Render Video12

# Renders all 1680 frames of the Video12 composition in 15 parallel
# jobs (112 frames each). Each job uploads its 112-frame mp4 as an artifact;
# the artifacts are concatenated and muxed with audio/mix.wav locally
# afterwards. No frames are rendered locally for this video.
#
# Trigger manually from the Actions tab (workflow_dispatch).

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: 0
            start: 0
            end: 111
          - job: 1
            start: 112
            end: 223
          - job: 2
            start: 224
            end: 335
          - job: 3
            start: 336
            end: 447
          - job: 4
            start: 448
            end: 559
          - job: 5
            start: 560
            end: 671
          - job: 6
            start: 672
            end: 783
          - job: 7
            start: 784
            end: 895
          - job: 8
            start: 896
            end: 1007
          - job: 9
            start: 1008
            end: 1119
          - job: 10
            start: 1120
            end: 1231
          - job: 11
            start: 1232
            end: 1343
          - job: 12
            start: 1344
            end: 1455
          - job: 13
            start: 1456
            end: 1567
          - job: 14
            start: 1568
            end: 1679
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Poppins fonts (karaoke text uses Poppins ExtraBold)
        run: |
          mkdir -p ~/.fonts
          cp fonts/*.ttf ~/.fonts/
          fc-cache -f
          fc-list | grep -i poppins

      - name: Install ffmpeg (needed for the ffprobe verification step)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Ensure Chrome Headless Shell
        run: npx remotion browser ensure

      - name: Render frames ${{ matrix.start }}-${{ matrix.end }}
        run: >
          npx remotion render Video12
          video12-chunk-${{ matrix.job }}.mp4
          --frames=${{ matrix.start }}-${{ matrix.end }}
          --concurrency=1
          --timeout=300000

      - name: Verify chunk (must be exactly 112 frames, 1080x1920)
        run: |
          FRAMES=$(ffprobe -v error -count_frames -select_streams v:0 \
            -show_entries stream=nb_read_frames -of csv=p=0 \
            video12-chunk-${{ matrix.job }}.mp4)
          echo "frames=$FRAMES"
          test "$FRAMES" = "112"
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height -of csv=p=0 \
            video12-chunk-${{ matrix.job }}.mp4

      - name: Upload chunk artifact
        uses: actions/upload-artifact@v4
        with:
          name: video12-chunk-${{ matrix.job }}
          path: video12-chunk-${{ matrix.job }}.mp4
          retention-days: 7
